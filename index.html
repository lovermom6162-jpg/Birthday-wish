<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Fabiha ❤️</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<!-- Floating Hearts -->
<div id="hearts"></div>

<!-- Falling Roses -->
<div id="roses"></div>

<!-- Passcode Screen -->
<div id="lockScreen" class="screen">

<div class="glass">

<h1>🔒 Secret Passcode</h1>

<p>Enter Our Special Date ❤️</p>

<input
id="passcode"
type="password"
maxlength="6"
placeholder="******"
autocomplete="off">

<button id="unlockBtn">
Unlock ❤️
</button>

<p id="wrong">
Wrong Passcode ❌
</p>

</div>

</div>

<!-- Loading -->
<div id="loading" class="screen">

<h1>🍰 Loading Your Wish🍰❤️</h1>

</div>

<!-- Main Website -->
<div id="app">

<div class="glass">

<h1>💖 Hey Fabiha 💖</h1>

<img
id="photo"
src="1.jpg"
alt="photo">

<p class="text">

Happy Birthday To You My Girl 😊 ❤️

</p>

<button id="surpriseBtn">

Open Surprise 🎁

</button>

<!-- Love Letter -->
<div id="loveMessage">

<h2>💌 My Letter</h2>

<p id="typing"></p>

</div>

<!-- Countdown -->
<div id="countdown">

<h2>⏳ Countdown</h2>

<p id="timer"></p>

</div>

<!-- Proposal -->
<div id="proposal">

<h1>
  
Do you want a gift? 🧧 

</h1>

<button id="yesBtn">

YES ❤️

</button>

</div>

</div>

</div>

<audio id="music" loop>

<source src="music.mp3" type="audio/mpeg">

</audio>

<script src="script.js"></script>

</body>

</html>
